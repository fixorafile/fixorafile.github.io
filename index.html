<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixora File – Design Portfolio</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>html,body{margin:0;background:#fff}:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
[data-arrows]{scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:auto}
[data-arrows]>button{position:relative}
[data-arrows]>button::before,[data-arrows]>button::after{content:"";position:absolute;bottom:-5px;width:12px;height:12px;border-radius:50%;border:2px solid #4c1d95;background:#fff;box-shadow:0 0 0 2px #fff;opacity:0;transition:opacity .08s;pointer-events:none;z-index:2}
[data-arrows]>button::before{left:18%}
[data-arrows]>button::after{right:18%}
[data-train]>button::before,[data-train]>button::after{opacity:1}
[data-train=fwd]>button::before,[data-train=fwd]>button::after{animation:fx-spin .45s linear infinite reverse}
[data-train=back]>button::before,[data-train=back]>button::after{animation:fx-spin .45s linear infinite}
[data-train]>button{animation:fx-bob .26s ease-in-out infinite}
[data-train]>button:nth-child(even){animation-delay:.13s}
@keyframes fx-spin{to{transform:rotate(360deg)}}
@keyframes fx-bob{0%,100%{translate:0 0}50%{translate:0 -1.5px}}
.fx-tunnel{display:none!important;position:absolute;z-index:15;width:26px;pointer-events:none;opacity:0;transition:opacity .3s;background-color:#120a20;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px);border:3px solid #6b5444;box-shadow:inset 0 0 10px #000}
.fx-tunnel.fx-on{opacity:1}
.fx-tl{border-left-width:0;border-radius:0 999px 999px 0}
.fx-tr{border-right-width:0;border-radius:999px 0 0 999px}
[data-arrows]::-webkit-scrollbar{display:none}
.fx-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:34px;height:34px;border-radius:9999px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#9333ea,#6d28d9);box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .15s,opacity .15s}
.fx-arrow:hover{transform:translateY(-50%) scale(1.1)}
.fx-arrow.fx-hide{opacity:0;pointer-events:none}
.fx-l{left:16px}.fx-r{right:16px}
:root{--fxm:42px}
body{overflow-x:hidden}
@media(max-width:767px){:root{--fxm:34px}.fx-arrow{width:28px;height:28px}.fx-hero{height:220px!important}[data-arrows]>button::before,[data-arrows]>button::after{width:10px;height:10px}}

    var els=document.querySelectorAll('.overflow-x-auto');
    for(var i=0;i<els.length;i++)setup(els[i]);
  }
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
  scan();
})();
</script></body></html>
